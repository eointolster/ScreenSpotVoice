<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScreenSpot local test page</title><link rel="icon" href="data:,">
<style>
body{font:16px system-ui;margin:0;color:#16243a;background:#eaf3fb}header{padding:18px 25px;background:#164575;color:white;position:sticky;top:0;z-index:1}main{padding:25px;min-height:1700px}.grid{display:flex;flex-wrap:wrap;gap:18px}.card{background:white;border:2px solid #9abbd6;border-radius:10px;padding:18px;min-width:200px;min-height:120px;resize:both;overflow:auto}.move{cursor:grab;touch-action:none}.move:active{cursor:grabbing}button{padding:10px 16px;border:0;border-radius:7px;background:#096ca6;color:white;cursor:pointer}canvas{background:#fff5dd;border:1px solid #987}.low{margin-top:850px}
</style>
<header><strong>ScreenSpot calibration page</strong> <span>Drag or resize cards; scroll; test ambiguous labels.</span></header>
<main><div class="grid">
<div class="card move"><h2>Media</h2><button id="upload">Upload an image</button><input id="file" type="file" accept="image/*" hidden></div>
<div class="card move"><h2>Lucas.jpg</h2><div style="width:120px;height:75px;background:linear-gradient(130deg,#678fd0,#ffb65b);border-radius:6px"></div></div>
<div class="card move"><h2>Export</h2><button>Export</button></div>
<div class="card move"><h2>Export</h2><button>Export</button></div>
<div class="card"><h2>Canvas target</h2><canvas id="drawing" width="240" height="110"></canvas></div>
</div><div class="low"><h2>Below the fold</h2><button>Upload an image</button></div></main>
<script>
document.getElementById('upload').onclick=()=>document.getElementById('file').click();
const ctx=document.getElementById('drawing').getContext('2d');ctx.fillStyle='#ff8d21';ctx.fillRect(38,25,100,62);ctx.fillStyle='#12233c';ctx.font='17px sans-serif';ctx.fillText('Canvas star',45,62);
for(const card of document.querySelectorAll('.move')){card.addEventListener('pointerdown',e=>{if(e.target!==card)return;card.setPointerCapture(e.pointerId);const x=e.clientX,y=e.clientY,left=card.offsetLeft,top=card.offsetTop;const move=p=>{card.style.position='relative';card.style.left=(p.clientX-x)+'px';card.style.top=(p.clientY-y)+'px'};card.addEventListener('pointermove',move);card.addEventListener('pointerup',()=>card.removeEventListener('pointermove',move),{once:true})})}
</script></html>
